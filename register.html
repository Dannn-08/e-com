<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create an Aurelia account.">
  <title>Register — Aurelia</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <div data-site-header></div>
  <main class="auth-page">
    <div class="auth-visual"><img src="images/auth.svg" alt="Minimal neutral lifestyle arrangement"></div>
    <section class="auth-panel">
      <div class="auth-card">
        <p class="eyebrow">New here</p>
        <h1>Create account</h1>
        <p class="lead">This prototype stores only basic demo profile data in your browser.</p>
        <div class="form-message" data-form-message aria-live="polite"></div>
        <form class="auth-form" data-register-form novalidate>
          <div class="form-field"><label for="reg-first">First Name</label><input class="text-input" id="reg-first" name="firstName" autocomplete="given-name" required></div>
          <div class="form-field"><label for="reg-last">Last Name</label><input class="text-input" id="reg-last" name="lastName" autocomplete="family-name" required></div>
          <div class="form-field"><label for="reg-email">Email</label><input class="text-input" id="reg-email" name="email" type="email" autocomplete="email" required></div>
          <div class="form-field"><label for="reg-password">Password</label><input class="text-input" id="reg-password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
          <div class="form-field"><label for="reg-confirm">Confirm Password</label><input class="text-input" id="reg-confirm" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
          <button class="btn btn-primary btn-block" type="submit">Create Account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
  <div data-site-footer></div>
</body>
</html>
