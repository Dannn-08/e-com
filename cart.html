<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your Aurelia shopping cart.">
  <title>Cart — Aurelia</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <div data-site-header></div>
  <main>
    <section class="page-hero"><div class="container"><p class="eyebrow">Your selection</p><h1>Shopping cart</h1></div></section>
    <section class="container cart-layout">
      <div>
        <div class="cart-list" data-cart-list></div>
        <div class="cart-actions-row" data-cart-actions>
          <button class="btn btn-ghost" type="button" data-clear-cart>Clear Cart</button>
          <a class="btn btn-secondary" href="shop.html">Continue Shopping</a>
        </div>
      </div>
      <aside class="summary-card" data-cart-summary aria-label="Order summary"></aside>
    </section>
  </main>
  <script src="js/app.js"></script>
  <div data-site-footer></div>
</body>
</html>
